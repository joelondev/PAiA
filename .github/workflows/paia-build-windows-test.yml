name: PAiA Windows test build

# Unsigned Windows x64 installer for hardware testing.
# - No code-signing or updater secrets needed (updater artifacts disabled).
# - WebView2 is embedded so the installer works with no network.
# - Pair with the offline pack (scripts/paia/make-offline-pack.sh) for the
#   default model and llama.cpp engines.
on:
  push:
    branches: ['paia/**']
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (x.y.z)'
        default: '0.8.2'
        required: true

jobs:
  test-offline-pack-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build a small fake pack
        shell: pwsh
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'pack'
          $m = Join-Path $pack 'data\llamacpp\models\test-model'
          $b = Join-Path $pack 'data\llamacpp\backends\b1\win-common_cpus-x64\build\bin'
          New-Item -ItemType Directory -Force $m, $b | Out-Null
          'model_path: llamacpp/models/test-model/model.gguf' | Set-Content (Join-Path $m 'model.yml')
          [IO.File]::WriteAllBytes((Join-Path $m 'model.gguf'), [byte[]](1..255))
          'exe' | Set-Content (Join-Path $b 'llama-server.exe')
          Copy-Item scripts/paia/offline-pack/* $pack
          $lines = @('# test manifest')
          Get-ChildItem (Join-Path $pack 'data') -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($pack.Length + 1) -replace '\\', '/'
            $lines += "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $rel"
          }
          $lines | Set-Content (Join-Path $pack 'manifest.sha256')

      - name: Installer copies a valid pack
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'data'
          & (Join-Path $env:RUNNER_TEMP 'pack\Install-PAiA-Offline-Pack.ps1') -DataFolder $dest
          foreach ($f in 'llamacpp\models\test-model\model.gguf',
                         'llamacpp\models\test-model\model.yml',
                         'llamacpp\backends\b1\win-common_cpus-x64\build\bin\llama-server.exe') {
            if (-not (Test-Path (Join-Path $dest $f))) { throw "missing after install: $f" }
          }
          Write-Host 'valid pack installed OK'

      - name: Installer rejects a corrupted pack
        shell: pwsh
        run: |
          $pack = Join-Path $env:RUNNER_TEMP 'pack'
          Add-Content (Join-Path $pack 'data\llamacpp\models\test-model\model.gguf') 'tampered'
          $failed = $false
          try {
            & (Join-Path $pack 'Install-PAiA-Offline-Pack.ps1') -DataFolder (Join-Path $env:RUNNER_TEMP 'data2')
          } catch { $failed = $true; Write-Host "rejected as expected: $_" }
          if (-not $failed) { throw 'corrupted pack was NOT rejected' }
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'data2\llamacpp')) { throw 'files were copied despite failed verification' }

  build-windows-x64:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || '0.8.2' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install jq
        uses: dcarbone/install-jq-action@b7ef57d46ece78760b4019dbc4080a1ba2a40b45 # v3.2.0

      - name: Configure test build
        shell: bash
        run: |
          set -euo pipefail
          # Version, no updater artifacts (no signing key in this workflow)
          jq --arg v "$VERSION" '.version = $v | .bundle.createUpdaterArtifacts = false' \
            src-tauri/tauri.conf.json > /tmp/c.json && mv /tmp/c.json src-tauri/tauri.conf.json
          # NSIS template + embedded WebView2 so install works fully offline
          jq '.bundle.windows.nsis.template = "tauri.bundle.windows.nsis.template"
              | .bundle.windows.webviewInstallMode = {"type": "offlineInstaller", "silent": true}' \
            src-tauri/tauri.windows.conf.json > /tmp/w.json && mv /tmp/w.json src-tauri/tauri.windows.conf.json
          jq --arg v "$VERSION" '.version = $v' web-app/package.json > /tmp/p.json && mv /tmp/p.json web-app/package.json
          sed -i "s/jan_version/$VERSION/g; s/jan_build/$VERSION.0/g; s/jan_productname/Jan/g; s/jan_mainbinaryname/jan/g" \
            src-tauri/tauri.bundle.windows.nsis.template
          # Jan's template hard-codes their CI checkout path (D:\a\jan\jan); use ours.
          WS="$GITHUB_WORKSPACE" perl -pi -e 's/D:\\a\\jan\\jan/$ENV{WS}/g' src-tauri/tauri.bundle.windows.nsis.template
          if grep -q 'a\\jan\\jan' src-tauri/tauri.bundle.windows.nsis.template; then
            echo "NSIS template still contains Jan's CI path" >&2; exit 1
          fi
          # Current Tauri CLIs keep nsis_tauri_utils.dll in %LOCALAPPDATA%\tauri\NSIS,
          # not under target/; search there too.
          PLUG="$LOCALAPPDATA\\tauri\\NSIS\\Plugins\\x86-unicode\\additional" \
            perl -pi -e 's/^(!addplugindir "\$\{ADDITIONALPLUGINSPATH\}".*)$/$1\n!addplugindir "$ENV{PLUG}"/' \
            src-tauri/tauri.bundle.windows.nsis.template
          grep -n 'INSTALLERICON\|addplugindir' src-tauri/tauri.bundle.windows.nsis.template

      - name: Configure Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false

      - name: Update-source guard
        shell: bash
        run: bash scripts/check-update-sources.sh

      - name: Build app
        shell: bash
        run: make build

      - name: Locate NSIS plugins (diagnostics on failure)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:LOCALAPPDATA, src-tauri\target -Recurse -Filter nsis_tauri_utils.dll -ErrorAction SilentlyContinue |
            ForEach-Object { $_.FullName }

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: paia-windows-x64-installer-${{ env.VERSION }}
          path: ./src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: paia-windows-x64-msi-${{ env.VERSION }}
          path: ./src-tauri/target/release/bundle/msi/*.msi
